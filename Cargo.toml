[workspace]
members = ["crates/ap0dl-core", "crates/ap0dl-cli"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/rares9301/ap0dl"

[workspace.dependencies]
async-trait = "0.1"
aes = "0.8"
axum = "0.8"
bytes = "1"
cbc = { version = "0.1", features = ["alloc"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "7"
futures = "0.3"
indicatif = "0.18"
json5 = "1"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "json",
  "stream",
  "cookies",
] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
urlencoding = "2"
which = "8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true